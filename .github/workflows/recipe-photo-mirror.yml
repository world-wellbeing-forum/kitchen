name: Mirror verified recipe photos

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recipe-photo-mirror.yml"
      - "scripts/mirror-recipe-images.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recipe-photo-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image processing dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Mirror verified Commons images
        run: python scripts/mirror-recipe-images.py

      - name: Validate recipes and build site
        run: |
          npm ci
          npm run validate
          npm run build

      - name: Commit local image assets and attribution updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/recipes assets/images/attributions.json recipes research/recipe-images.json
          if git diff --cached --quiet; then
            echo "No local image changes to commit."
            exit 0
          fi
          git commit -m "Mirror verified recipe photos as local WebP assets"
          git push origin main
