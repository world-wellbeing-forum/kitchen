name: Check and build World Wellbeing Kitchen
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate recipes
        run: node scripts/validate-recipes.js
      - name: Build site
        run: node scripts/build-site.js
      - name: Check JavaScript syntax
        run: node --check assets/js/site.js
